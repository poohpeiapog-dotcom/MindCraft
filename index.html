<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindCraft</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
/* RESET */
* { box-sizing: border-box; margin: 0; padding: 0; }

/* === GLOBAL === */
body {
  font-family: 'Press Start 2P', cursive;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(#87e4ff, #c8f7b0);
  padding: 20px;
  color: #006400;
}

/* === WOOD FRAME === */
.landing-content {
  width: 100%;
  max-width: 900px;
  height: 90vh;
  background: #8b5a2b;
  border-radius: 28px;
  padding: 16px;
  box-shadow:
    inset -8px -8px 0 rgba(0,0,0,.3),
    0 12px 0 #5c3a1a;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Wood title */
.landing-content::before {
  content: "MINDCRAFT";
  position: absolute;
  top: -14px;
  left: 50%;
  transform: translateX(-50%);
  background: #8b5a2b;
  padding: 6px 22px;
  font-size: 11px;
  color: #ffd966;
  text-shadow: 2px 2px #000;
  border-radius: 10px;
  box-shadow: 0 4px 0 #5c3a1a;
}

/* === INNER PANEL === */
.panel {
  width: 100%;
  height: 100%;
  background: linear-gradient(#8fe9ff 55%, #7dd37d);
  border-radius: 18px;
  padding: 40px 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,.3);
}

/* === TITLE === */
.landing-title {
  font-size: 18px;
  margin-bottom: 40px;
  text-shadow: 3px 3px #fff;
}

/* === BUTTONS === */
.get-started-btn,
.auth-section button {
  font-family: 'Press Start 2P', cursive;
  background: #a56b34;
  color: #fff;
  border: none;
  border-radius: 12px;
  padding: 14px 28px;
  font-size: 9px;
  cursor: pointer;
  box-shadow:
    inset -4px -4px 0 rgba(0,0,0,.25),
    0 6px 0 #5c3a1a;
  transition: transform 0.1s;
}

.get-started-btn:hover,
.auth-section button:hover {
  transform: translateY(-2px);
}

/* Start button highlight */
.get-started-btn {
  background: #d4af37;
  box-shadow:
    inset -4px -4px 0 rgba(0,0,0,.25),
    0 6px 0 #b8860b;
  margin-bottom: 30px;
}

/* Auth buttons */
.auth-section {
  display: none;
  gap: 20px;
}

/* === FOOTER === */
footer {
  position: absolute;
  bottom: 12px;
  width: 100%;
  text-align: center;
  font-size: 7px;
  color: #006400;
}
</style>
</head>

<body>

<!-- Landing Content -->
<div class="landing-content">
  <div class="panel">
    <h1 class="landing-title">🧠 WELCOME TO<br>MINDCRAFT</h1>

    <button class="get-started-btn" id="getStartedBtn">START GAME</button>

    <div class="auth-section" id="authSection">
      <button onclick="location.href='Main/Account/signin.html'">LOGIN</button>
      <button onclick="location.href='Main/Account/signup.html'">SIGN UP</button>
    </div>
  </div>
</div>

<footer>
  © 2025 MindCraft | Created by Kuya AJ & Team
</footer>

<!-- ✅ ORIGINAL FUNCTIONALITY – UNCHANGED -->
<script>
document.getElementById('getStartedBtn').addEventListener('click', () => {
  document.getElementById('authSection').style.display = 'flex';
  document.getElementById('getStartedBtn').style.display = 'none';
});
</script>

</body>
</html>
